<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="main.js"></script>
  <title>Anime | Login</title>
</head>

<body>
  <!-- Header -->
  <section id="header">
    <a href="#"><img width="130" src="img/Anime.png" alt="" class="logo"></a>
    <div>
      <ul id="navbar">
        <li><a href="index.html">Home</a></li>
        <li><a href="About.html">Anime Merch</a></li>
        <li><a href="Upcoming.html">Upcoming</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a class="active" href="login.html">Login</a></li>
        <li><a href="singup.html">Signup</a></li>
      </ul>
    </div>
    <div id="mobile">
      <i id="bar" class="fa-solid fa-bars"></i>
    </div>
  </section>

  <!-- Login Form -->
  <section class="login-container">
    <h2>Login to Anime Store</h2>
    <form id="login-form" class="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <h3>Don’t have an account? <a style="color: beige;"     href="singup.html">Sign up</a></h3>
  </section>

  <!-- ✅ Unified Firebase Login Logic -->
  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          alert("🎉 Login successful!");
          window.location.href = "index.html";
        })
        .catch(err => {
          alert("❌ " + err.message);
        });
    });
  </script>
</body>
</html>
